[package]
name = "kronoa"
description = "Kronoa: a fast, native calendar with a Rust engine and a Qt 6 / QML interface"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "kronoa"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
kronoa-core = { path = "../crates/kronoa-core" }
serde_json = "1"
serde.workspace = true
anyhow.workspace = true
chrono.workspace = true
notify-rust = "4"

[build-dependencies]
cxx-qt-build = "0.10"
